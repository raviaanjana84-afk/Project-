            margin-top: 10px;

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderYoga() {
            const grid = document.getElementById('yogaGrid');
            const filtered = yogaItems.filter(y => {
                const matchCat = currentCategory === 'all' || y.category === currentCategory;
                const matchSearch = y.title.includes(searchQuery) ||
                                    y.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    y.desc.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई जानकारी नहीं मिली। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'asan') return 'gold';
                if (cat === 'pranayam') return 'blue';
                if (cat === 'dhyan') return 'purple';
                if (cat === 'mudra') return 'green';
                if (cat === 'chakra') return 'gold';
                if (cat === 'shatkarma') return 'blue';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'asan': 'आसन',
                    'pranayam': 'प्राणायाम',
                    'dhyan': 'ध्यान',
                    'mudra': 'मुद्रा',
                    'chakra': 'चक्र',
                    'shatkarma': 'षट्कर्म'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(y => {
                let metaHtml = '';
                if (y.meta) {
                    metaHtml = Object.entries(y.meta).map(([k, v]) => 
                        `<span><i class="fa-solid fa-circle-dot"></i> <strong>${k}:</strong> ${v}</span>`
                    ).join('');
                }

                return `
                    <div class="yoga-card">
                        <div class="y-header">
                            <div class="y-title">
                                ${y.title}
                                <span class="y-en">${y.en}</span>
                            </div>
                            <span class="y-badge ${badgeClass(y.category)}">${catName(y.category)}</span>
                        </div>
                        <div class="y-desc">
                            <strong>📖 परिचय:</strong> ${y.desc}
                        </div>
                        <div class="y-benefits">
                            <strong>✨ लाभ:</strong> ${y.benefits}
                        </div>
                        <div class="y-meta">
                            ${metaHtml}
                        </div>
                        <details class="yoga-details">
                            <summary>अधिक जानकारी</summary>
                            <div class="d-body">${y.extra || ''}</div>
                        </details>
                    </div>
                `;
            }).join('');
        }

        function filterYoga() {
            searchQuery = document.getElementById('yogaSearch').value.trim();
            renderYoga();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderYoga();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderYoga();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — योग कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
