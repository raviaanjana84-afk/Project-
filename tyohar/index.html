<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>त्योहार कोश — सभी हिंदू त्योहार | Sanatan Gyan Kosh</title>
    <meta name="description" content="सभी हिंदू त्योहारों की सूची — दीपावली, होली, नवरात्रि, जन्माष्टमी और बहुत कुछ। हर त्योहार की पूरी जानकारी के लिए click करें।" />
    <meta name="theme-color" content="#7A2E2E" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        /* Festival Card Grid */
        .festival-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .festival-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--ink);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .festival-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--maroon), var(--gold));
            opacity: 0;
            transition: var(--transition);
        }
        .festival-card:hover::before {
            opacity: 1;
        }
        .festival-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--gold);
        }
        .festival-card .fc-hero {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(122,46,46,0.08));
            padding: 20px 12px 14px;
            text-align: center;
            position: relative;
        }
        .festival-card .fc-icon {
            font-size: 44px;
            display: block;
            line-height: 1;
        }
        .festival-card .fc-name {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--maroon);
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.2;
        }
        .festival-card .fc-en {
            font-size: 10px;
            color: var(--ink-light);
            display: block;
            margin-top: 2px;
        }
        .festival-card .fc-info {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .festival-card .fc-when {
            font-size: 10.5px;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.4;
        }
        .festival-card .fc-when i {
            color: var(--gold);
            font-size: 10px;
        }
        .festival-card .fc-btn {
            margin-top: auto;
            padding: 8px;
            background: var(--maroon);
            color: white;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: var(--transition);
        }
        .festival-card:hover .fc-btn {
            background: var(--gold);
            color: var(--maroon);
        }

        /* Badge */
        .fc-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
            color: white;
        }
        .fc-badge.major { background: var(--maroon); }
        .fc-badge.regional { background: #27ae60; }
        .fc-badge.seasonal { background: #2980b9; }
        .fc-badge.monthly { background: #8e44ad; }

        @media (max-width: 380px) {
            .festival-grid { gap: 10px; }
            .festival-card .fc-icon { font-size: 36px; }
            .festival-card .fc-name { font-size: 14px; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a href="../index.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">
            <span class="eyebrow">🕉️ सनातन ज्ञान कोश</span>
            <h1>त्योहार कोश</h1>
        </div>
        <button class="icon-btn" id="darkToggle"><i class="fa-solid fa-moon"></i></button>
    </header>

    <div class="diya-row">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <main>

        <div class="hero-banner">
            <h2>🎉 त्योहार कोश</h2>
            <p>किसी भी त्योहार पर <strong>click करें</strong> और उसकी <strong>पूरी जानकारी</strong> पढ़ें!</p>
        </div>

        <div class="search-wrap">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="त्योहार खोजें..." oninput="filterFestivals()" />
        </div>

        <div class="cat-tabs" id="catTabs">
            <button class="cat-tab active" data-cat="all">✨ सभी</button>
            <button class="cat-tab" data-cat="major">🌟 प्रमुख</button>
            <button class="cat-tab" data-cat="regional">🗺️ क्षेत्रीय</button>
            <button class="cat-tab" data-cat="seasonal">🌦️ ऋतु</button>
        </div>

        <div class="festival-grid" id="festivalGrid"></div>

        <footer class="footer">
            <p>🕉️ सनातन ज्ञान कोश</p>
            <p>हर हिंदू के लिए मुफ्त ज्ञान का भंडार</p>
            <p class="footer-small">सभी कंटेंट पौराणिक स्रोतों पर आधारित है · 🙏 जय श्री राम</p>
        </footer>

    </main>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-link"><i class="fa-solid fa-house"></i><p>होम</p></a>
        <a href="../devta/index.html" class="nav-link"><i class="fa-solid fa-om"></i><p>देवता</p></a>
        <a href="../mantra/index.html" class="nav-link"><i class="fa-solid fa-book-open"></i><p>मंत्र</p></a>
        <a href="index.html" class="nav-link active"><i class="fa-solid fa-calendar-days"></i><p>त्योहार</p></a>
        <a href="../panchang/index.html" class="nav-link"><i class="fa-solid fa-puzzle-piece"></i><p>पंचांग</p></a>
    </nav>

    <script>
        // ============================================================
        //  FESTIVAL LIST
        // ============================================================

        const festivals = [
            { id: 'diwali', name: 'दीपावली', en: 'Diwali', icon: '🪔', category: 'major', when: 'कार्तिक अमावस्या · अक्टूबर-नवंबर', page: 'diwali.html' },
            { id: 'navratri', name: 'नवरात्रि', en: 'Navratri', icon: '🌺', category: 'major', when: 'चैत्र & आश्विन · 9 दिन', page: 'navratri.html' },
            { id: 'holi', name: 'होली', en: 'Holi', icon: '🎨', category: 'major', when: 'फाल्गुन पूर्णिमा · मार्च', page: 'holi.html' },
            { id: 'janmashtami', name: 'जन्माष्टमी', en: 'Janmashtami', icon: '🟡', category: 'major', when: 'भाद्रपद अष्टमी · अगस्त-सितंबर', page: 'janmashtami.html' },
            { id: 'mahashivratri', name: 'महाशिवरात्रि', en: 'Mahashivratri', icon: '🔱', category: 'major', when: 'फाल्गुन चतुर्दशी · फरवरी-मार्च', page: 'mahashivratri.html' },
            { id: 'ram-navami', name: 'राम नवमी', en: 'Ram Navami', icon: '🏹', category: 'major', when: 'चैत्र शुक्ल नवमी · मार्च-अप्रैल', page: 'ram-navami.html' },
            { id: 'dussehra', name: 'दशहरा', en: 'Dussehra', icon: '⚔️', category: 'major', when: 'आश्विन दशमी · अक्टूबर', page: 'dussehra.html' },
            { id: 'ganesh-chaturthi', name: 'गणेश चतुर्थी', en: 'Ganesh Chaturthi', icon: '🐘', category: 'major', when: 'भाद्रपद चतुर्थी · अगस्त-सितंबर', page: 'ganesh-chaturthi.html' },
            { id: 'rakhi', name: 'रक्षाबंधन', en: 'Raksha Bandhan', icon: '🎀', category: 'major', when: 'श्रावण पूर्णिमा · अगस्त', page: 'rakhi.html' },
            { id: 'karwa-chauth', name: 'करवा चौथ', en: 'Karwa Chauth', icon: '🌙', category: 'major', when: 'कार्तिक चतुर्थी · अक्टूबर-नवंबर', page: 'karwa-chauth.html' },
            { id: 'makar-sankranti', name: 'मकर संक्रांति', en: 'Makar Sankranti', icon: '🌞', category: 'major', when: '14-15 जनवरी', page: 'makar-sankranti.html' },
            { id: 'vasant-panchami', name: 'वसंत पंचमी', en: 'Vasant Panchami', icon: '📚', category: 'major', when: 'माघ पंचमी · जनवरी-फरवरी', page: 'vasant-panchami.html' },
            { id: 'chhath', name: 'छठ पूजा', en: 'Chhath Puja', icon: '🌅', category: 'regional', when: 'कार्तिक षष्ठी · अक्टूबर-नवंबर', page: 'chhath.html' },
            { id: 'onam', name: 'ओणम', en: 'Onam', icon: '🌾', category: 'regional', when: 'चिंगम मास · अगस्त-सितंबर', page: 'onam.html' },
            { id: 'pongal', name: 'पोंगल', en: 'Pongal', icon: '🌾', category: 'regional', when: 'तमिल मास · जनवरी', page: 'pongal.html' },
            { id: 'gudi-padwa', name: 'गुड़ी पड़वा', en: 'Gudi Padwa', icon: '🎊', category: 'regional', when: 'चैत्र प्रतिपदा · मार्च-अप्रैल', page: 'gudi-padwa.html' },
            { id: 'lohri', name: 'लोहड़ी', en: 'Lohri', icon: '🔥', category: 'regional', when: '13 जनवरी', page: 'lohri.html' },
            { id: 'bihu', name: 'बिहू', en: 'Bihu', icon: '🌸', category: 'regional', when: 'अप्रैल · अक्टूबर · जनवरी', page: 'bihu.html' }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        function renderFestivals() {
            const grid = document.getElementById('festivalGrid');
            const filtered = festivals.filter(f => {
                const matchCat = currentCategory === 'all' || f.category === currentCategory;
                const matchSearch = f.name.includes(searchQuery) ||
                                    f.en.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: var(--ink-light);">
                    <i class="fa-solid fa-search" style="font-size: 40px; display: block; margin-bottom: 10px; color: var(--border);"></i>
                    कोई त्योहार नहीं मिला।
                </div>`;
                return;
            }

            const badgeMap = {
                'major': 'प्रमुख',
                'regional': 'क्षेत्रीय',
                'seasonal': 'ऋतु',
                'monthly': 'मासिक'
            };

            grid.innerHTML = filtered.map(f => `
                <a href="${f.page}" class="festival-card">
                    <span class="fc-badge ${f.category}">${badgeMap[f.category]}</span>
                    <div class="fc-hero">
                        <span class="fc-icon">${f.icon}</span>
                        <div class="fc-name">${f.name}</div>
                        <span class="fc-en">${f.en}</span>
                    </div>
                    <div class="fc-info">
                        <div class="fc-when">
                            <i class="fa-solid fa-calendar"></i>
                            <span>${f.when}</span>
                        </div>
                        <div class="fc-btn">
                            <i class="fa-solid fa-book-open"></i> पूरी जानकारी
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function filterFestivals() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderFestivals();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderFestivals();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderFestivals();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }
    </script>
</body>
</html>
