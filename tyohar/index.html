        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        .tyohar-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .tyohar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 5px solid var(--gold);
            transition: var(--transition);
        }
        .tyohar-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--maroon);
        }
        .tyohar-card .t-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
        }
        .tyohar-card .t-title {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--maroon);
            font-weight: 700;
            flex: 1;
        }
        .tyohar-card .t-title .t-en {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            color: var(--ink-light);
            display: block;
            margin-top: 2px;
        }
        .tyohar-card .t-badge {
            font-size: 9px;
            background: var(--maroon);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tyohar-card .t-badge.gold { background: var(--gold); color: var(--maroon); }
        .tyohar-card .t-badge.green { background: #27ae60; }
        .tyohar-card .t-badge.blue { background: #2980b9; }
        .tyohar-card .t-badge.red { background: #e74c3c; }

        .tyohar-card .t-desc {
            background: #f8f4f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .tyohar-card .t-desc strong { color: var(--maroon); }

        .tyohar-card .t-vidhi {
            background: #eef7ee;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .tyohar-card .t-vidhi strong { color: #27ae60; }

        .tyohar-card .t-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }
        .tyohar-card .t-meta span {
            font-size: 10px;
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 10px;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tyohar-card .t-meta span i {
            color: var(--gold);
            font-size: 10px;
        }

        .tyohar-details {
            margin-top: 8px;
        }
        .tyohar-details summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--maroon);
            padding: 6px 0;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;

            content: '➕';
            font-size: 11px;
            transition: transform 0.3s;
        }
        .tyohar-details[open] summary::before {
            content: '➖';

            padding: 10px 0;
            font-size: 12.5px;

            padding: 40px 20px;
            color: var(--ink-light);
            font-size: 14px;
        }

            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);
        }

            .tyohar-card { padding: 14px 12px; }
            .tyohar-card .t-title { font-size: 16px; }
            .tyohar-card .t-desc,

        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderTyohars() {
            const grid = document.getElementById('tyoharGrid');
            const filtered = tyohars.filter(t => {
                const matchCat = currentCategory === 'all' || t.category === currentCategory;
                const matchSearch = t.title.includes(searchQuery) ||
                                    t.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    t.desc.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई त्योहार नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'major') return 'gold';
                if (cat === 'monthly') return 'green';
                if (cat === 'seasonal') return 'blue';
                if (cat === 'regional') return 'red';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'major': 'प्रमुख',
                    'monthly': 'मासिक',
                    'seasonal': 'ऋतु',
                    'regional': 'क्षेत्रीय'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(t => `
                <div class="tyohar-card">
                    <div class="t-header">
                        <div class="t-title">
                            ${t.title}
                            <span class="t-en">${t.en}</span>
                        </div>
                        <span class="t-badge ${badgeClass(t.category)}">${catName(t.category)}</span>
                    </div>
                    <div class="t-desc">
                        <strong>📖 परिचय:</strong> ${t.desc}
                    </div>
                    <div class="t-vidhi">
                        <strong>🙏 पूजा विधि:</strong> ${t.vidhi}
                    </div>
                    <div class="t-desc" style="background:#fef8e8;">
                        <strong>✨ लाभ:</strong> ${t.benefits}
                    </div>
                    <div class="t-meta">
                        <span><i class="fa-solid fa-calendar"></i> ${t.when}</span>
                        <span><i class="fa-solid fa-clock"></i> ${t.days}</span>
                    </div>
                    <details class="tyohar-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${t.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterTyohars() {
            searchQuery = document.getElementById('tyoharSearch').value.trim();
            renderTyohars();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderTyohars();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderTyohars();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — त्योहार कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
