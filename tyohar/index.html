<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>त्योहार कोश — संपूर्ण ज्ञान | Sanatan Gyan Kosh</title>
    <meta name="description" content="सभी हिंदू त्योहारों की संपूर्ण जानकारी — कथा, विधि, पूजा, मंत्र, क्या करें, क्या न करें। दीपावली, होली, नवरात्रि, जन्माष्टमी और बहुत कुछ।" />
    <meta name="theme-color" content="#7A2E2E" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        /* Main Card */
        .tyohar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 5px solid var(--gold);
            transition: var(--transition);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .tyohar-card:hover {
            box-shadow: var(--shadow-hover);
            border-left-color: var(--maroon);
        }
        .tyohar-card.open {
            border-left-color: var(--maroon);
        }

        /* Card Header (Clickable) */
        .tyohar-header {
            padding: 18px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .tyohar-header:hover {
            background: var(--bg);
        }
        .tyohar-card.open .tyohar-header {
            background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(122,46,46,0.06));
            border-bottom: 1px solid var(--border);
        }
        .tyohar-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .tyohar-icon {
            font-size: 32px;
            line-height: 1;
            flex-shrink: 0;
        }
        .tyohar-info {
            flex: 1;
        }
        .tyohar-name {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--maroon);
            font-weight: 700;
            line-height: 1.2;
        }
        .tyohar-name .tyohar-en {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            color: var(--ink-light);
            display: block;
            margin-top: 2px;
        }
        .tyohar-meta-line {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tyohar-meta-line .badge {
            background: var(--maroon);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 9px;
        }
        .tyohar-meta-line .badge.gold {
            background: var(--gold);
            color: var(--maroon);
        }
        .tyohar-arrow {
            color: var(--gold);
            font-size: 18px;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .tyohar-card.open .tyohar-arrow {
            transform: rotate(180deg);
        }

        /* Card Body (Details) */
        .tyohar-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease;
        }
        .tyohar-card.open .tyohar-body {
            max-height: 15000px;
        }
        .tyohar-body-inner {
            padding: 18px 16px;
        }

        .detail-section {
            margin-bottom: 18px;
        }
        .detail-section:last-child {
            margin-bottom: 0;
        }
        .detail-section h3 {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--maroon);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 6px;
        }
        .detail-section h3 .sec-icon {
            font-size: 20px;
        }
        .detail-section p {
            font-size: 13.5px;
            line-height: 1.9;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }
        .detail-section p strong {
            color: var(--maroon);
        }

        /* Timeline / Days */
        .day-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .day-item {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 14px;
            border-left: 4px solid var(--gold);
            transition: var(--transition);
        }
        .day-item:hover {
            border-left-color: var(--maroon);
            transform: translateX(3px);
        }
        .day-item .day-label {
            display: inline-block;
            background: var(--maroon);
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .day-item .day-label.gold {
            background: var(--gold);
            color: var(--maroon);
        }
        .day-item .day-title {
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--maroon);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .day-item .day-text {
            font-size: 12.5px;
            line-height: 1.7;
            color: var(--ink-soft);
        }
        .day-item .day-text strong {
            color: var(--maroon);
        }

        /* Steps List */
        .steps-list {
            list-style: none;
            padding: 0;
            counter-reset: step-counter;
            margin: 8px 0;
        }
        .steps-list li {
            counter-increment: step-counter;
            padding: 8px 10px 8px 40px;
            font-size: 13px;
            line-height: 1.8;
            color: var(--ink-soft);
            border-bottom: 1px dashed var(--border);
            position: relative;
        }
        .steps-list li:last-child { border-bottom: none; }
        .steps-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--maroon), var(--gold));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }
        .steps-list li strong { color: var(--maroon); }

        /* Mantra Box */
        .mantra-box {
            background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(122,46,46,0.05));
            border-left: 4px solid var(--gold);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: var(--font-display);
            font-size: 15px;
            text-align: center;
            margin: 8px 0;
            line-height: 1.8;
            color: var(--maroon);
            font-weight: 600;
        }
        .mantra-box small {
            display: block;
            font-family: var(--font-body);
            font-size: 11px;
            color: var(--ink-soft);
            font-weight: 400;
            margin-top: 4px;
        }

        /* Do / Don't */
        .do-dont-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .do-box, .dont-box {
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.7;
        }
        .do-box {
            background: #eef7ee;
            border-left: 3px solid #27ae60;
        }
        .do-box h4 {
            color: #27ae60;
            font-size: 12px;
            margin-bottom: 6px;
            font-family: var(--font-display);
        }
        .dont-box {
            background: #fdecea;
            border-left: 3px solid #dc3545;
        }
        .dont-box h4 {
            color: #dc3545;
            font-size: 12px;
            margin-bottom: 6px;
            font-family: var(--font-display);
        }
        .do-box ul, .dont-box ul {
            list-style: none;
            padding: 0;
        }
        .do-box ul li, .dont-box ul li {
            padding: 2px 0;
            display: flex;
            align-items: flex-start;
            gap: 5px;
        }
        .do-box ul li::before { content: '✅'; flex-shrink: 0; font-size: 11px; }
        .dont-box ul li::before { content: '❌'; flex-shrink: 0; font-size: 11px; }

        /* Highlight */
        .highlight-box {
            background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(122,46,46,0.06));
            border-left: 4px solid var(--gold);
            padding: 12px 14px;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 12.5px;
            line-height: 1.8;
            color: var(--ink-soft);
        }
        .highlight-box strong { color: var(--maroon); }

        /* FAQ */
        .faq-item {
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .faq-q {
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: var(--maroon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .faq-q i {
            color: var(--gold);
            font-size: 12px;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .faq-item.open .faq-q i {
            transform: rotate(180deg);
        }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 12px;
            font-size: 12.5px;
            line-height: 1.8;
            color: var(--ink-soft);
        }
        .faq-item.open .faq-a {
            max-height: 500px;
            padding: 0 12px 12px;
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-light);
            font-size: 14px;
        }
        .no-result i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);
        }

        @media (max-width: 420px) {
            .tyohar-icon { font-size: 26px; }
            .tyohar-name { font-size: 15px; }
            .do-dont-grid { grid-template-columns: 1fr; }
            .detail-section h3 { font-size: 14px; }
        }
    </style>
</head>

        </footer>

    </main>

    <script>
        // ============================================================
        //  TYOHAR DATABASE — Deep Details
        // ============================================================

        const tyohars = [
            // ==================== दीपावली ====================
            {
                id: 'diwali',
                name: 'दीपावली',
                en: 'Diwali',
                icon: '🪔',
                category: 'major',

                katha: 'जब भगवान राम ने 14 वर्ष का वनवास पूरा किया और रावण का वध करके अयोध्या वापस लौटे, तो अयोध्या के निवासियों ने उनके स्वागत में पूरी नगरी को दीपों से सजा दिया। यही परंपरा आज दीपावली के रूप में जारी है। एक अन्य कथा के अनुसार, समुद्र मंथन के समय कार्तिक अमावस्या को माँ लक्ष्मी प्रकट हुईं।',
                daysDetail: [
                    { day: 'दिन 1', name: 'धनतेरस', desc: 'धन्वंतरि प्रकट हुए। सोना, चांदी, बर्तन, झाड़ू खरीदें। धन और स्वास्थ्य के लिए।' },
                    { day: 'दिन 2', name: 'नरक चतुर्दशी', desc: 'कृष्ण जी ने नरकासुर का वध किया। अभ्यंग स्नान करें, यम के लिए दीपक जलाएँ।' },
                    { day: 'दिन 3 ⭐', name: 'लक्ष्मी पूजन (दीपावली)', desc: 'माँ लक्ष्मी और गणेश जी की पूजा करें। मुख्य दिन।' },
                    { day: 'दिन 4', name: 'गोवर्धन पूजा / अन्नकूट', desc: 'गोवर्धन पर्वत की पूजा, 56 प्रकार के व्यंजन बनाएँ।' },
                    { day: 'दिन 5', name: 'भाई दूज', desc: 'बहन भाई को तिलक करे। भाई-बहन के प्रेम का पर्व।' }
                ],
                vidhi: [
                    'प्रातः स्नान करके स्वच्छ वस्त्र धारण करें',
                    'घर की पूरी सफाई करें',
                    'मुख्य द्वार पर रंगोली बनाएँ',
                    'पूजा स्थान को फूलों से सजाएँ',
                    'तांबे के कलश में जल, सुपारी, सिक्का डालें',
                    'लक्ष्मी-गणेश की प्रतिमा स्थापित करें',
                    'संकल्प लें और गणेश पूजा करें',
                    'लक्ष्मी पूजा — षोडशोपचार से करें',
                    'खीर, मिठाई, फल का भोग लगाएँ',
                    'आरती गाएँ — "ॐ जय लक्ष्मी माता"',

                    'प्रसाद बाँटें'
                ],
                mantra: 'ॐ श्रीं ह्रीं क्लीं महालक्ष्म्यै नमः',
                mantraMeaning: 'माँ लक्ष्मी का मुख्य मंत्र — 108 बार जपें',
                dos: [
                    'घर की सफाई करें',
                    'रंगोली बनाएँ',
                    'दीप जलाएँ',

                donts: [

                    'झूठ न बोलें',

                faqs: [
                    { q: 'दीपावली पर लक्ष्मी पूजा क्यों?', a: 'इस दिन समुद्र मंथन से माँ लक्ष्मी प्रकट हुईं। वे साफ-सुथरे घर में निवास करती हैं।' },
                    { q: 'कितने दीपक जलाएँ?', a: 'कम से कम 11 — मंदिर, मुख्य द्वार, आँगन, रसोई, तुलसी के पौधे, और घर के हर कोने में।' },

                ]
            },

            // ==================== होली ====================
            {
                id: 'holi',
                name: 'होली',
                en: 'Holi',
                icon: '🎨',
                category: 'major',
                when: 'फाल्गुन पूर्णिमा (मार्च)',

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderTyohars() {
            const list = document.getElementById('tyoharList');
            const filtered = tyohars.filter(t => {
                const matchCat = currentCategory === 'all' || t.category === currentCategory;
                const matchSearch = t.name.includes(searchQuery) ||
                                    t.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    t.intro.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई त्योहार नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const catBadge = (cat) => {
                const map = {
                    'major': 'प्रमुख',
                    'monthly': 'मासिक',
                    'seasonal': 'ऋतु',
                    'regional': 'क्षेत्रीय'
                };
                return map[cat] || cat;
            };

            list.innerHTML = filtered.map(t => `
                <div class="tyohar-card" id="card-${t.id}">
                    <div class="tyohar-header" onclick="toggleTyohar('${t.id}')">
                        <div class="tyohar-header-left">
                            <div class="tyohar-icon">${t.icon}</div>
                            <div class="tyohar-info">
                                <div class="tyohar-name">
                                    ${t.name}
                                    <span class="tyohar-en">${t.en}</span>
                                </div>
                                <div class="tyohar-meta-line">
                                    <span class="badge">${catBadge(t.category)}</span>
                                    <span><i class="fa-solid fa-calendar"></i> ${t.when}</span>
                                    <span><i class="fa-solid fa-clock"></i> ${t.days}</span>
                                </div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down tyohar-arrow"></i>
                    </div>
                    <div class="tyohar-body">
                        <div class="tyohar-body-inner">

                            <!-- परिचय -->
                            <div class="detail-section">
                                <h3><span class="sec-icon">📖</span> परिचय</h3>
                                <p>${t.intro}</p>
                            </div>

                            <!-- कथा -->
                            <div class="detail-section">
                                <h3><span class="sec-icon">📜</span> कथा</h3>
                                <p>${t.katha}</p>
                            </div>

                            <!-- दिन-वार विवरण -->
                            ${t.daysDetail ? `
                                <div class="detail-section">
                                    <h3><span class="sec-icon">📅</span> दिन-वार विवरण</h3>
                                    <div class="day-timeline">
                                        ${t.daysDetail.map(d => `
                                            <div class="day-item">
                                                <span class="day-label ${d.day.includes('⭐') ? '' : 'gold'}">${d.day}</span>
                                                <div class="day-title">${d.name}</div>
                                                <div class="day-text">${d.desc}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- पूजा विधि -->
                            ${t.vidhi ? `
                                <div class="detail-section">
                                    <h3><span class="sec-icon">🙏</span> पूजा विधि</h3>
                                    <ol class="steps-list">
                                        ${t.vidhi.map(v => `<li>${v}</li>`).join('')}
                                    </ol>
                                </div>
                            ` : ''}

                            <!-- मंत्र -->
                            ${t.mantra ? `
                                <div class="detail-section">
                                    <h3><span class="sec-icon">📿</span> मुख्य मंत्र</h3>
                                    <div class="mantra-box">
                                        ${t.mantra}
                                        <small>${t.mantraMeaning}</small>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- क्या करें / क्या न करें -->
                            <div class="detail-section">
                                <h3><span class="sec-icon">✅</span> क्या करें और क्या न करें</h3>
                                <div class="do-dont-grid">
                                    <div class="do-box">
                                        <h4>✅ क्या करें</h4>
                                        <ul>
                                            ${t.dos.map(d => `<li>${d}</li>`).join('')}
                                        </ul>
                                    </div>
                                    <div class="dont-box">
                                        <h4>❌ क्या न करें</h4>
                                        <ul>
                                            ${t.donts.map(d => `<li>${d}</li>`).join('')}
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <!-- FAQs -->
                            ${t.faqs ? `
                                <div class="detail-section">
                                    <h3><span class="sec-icon">❓</span> अक्सर पूछे जाने वाले प्रश्न</h3>
                                    ${t.faqs.map((f, i) => `
                                        <div class="faq-item">
                                            <div class="faq-q" onclick="toggleFaq(this)">
                                                <span>${f.q}</span>
                                                <i class="fa-solid fa-chevron-down"></i>
                                            </div>
                                            <div class="faq-a">${f.a}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleTyohar(id) {
            const card = document.getElementById(`card-${id}`);
            card.classList.toggle('open');

            if (card.classList.contains('open')) {
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
        }

        function toggleFaq(el) {
            el.parentElement.classList.toggle('open');
        }

        function filterTyohars() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderTyohars();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderTyohars();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderTyohars();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — त्योहार कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
