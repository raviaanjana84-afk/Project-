    <style>
        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        .sanskar-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sanskar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 5px solid var(--gold);
            transition: var(--transition);
        }
        .sanskar-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--maroon);
        }
        .sanskar-card .s-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
        }
        .sanskar-card .s-number {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            background: rgba(212,175,55,0.15);
            padding: 3px 10px;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .sanskar-card .s-title {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--maroon);
            font-weight: 700;
            flex: 1;
        }
        .sanskar-card .s-title .s-en {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            color: var(--ink-light);
            display: block;
            margin-top: 2px;
        }
        .sanskar-card .s-badge {
            font-size: 9px;
            background: var(--maroon);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .sanskar-card .s-badge.gold { background: var(--gold); color: var(--maroon); }
        .sanskar-card .s-badge.green { background: #27ae60; }
        .sanskar-card .s-badge.blue { background: #2980b9; }
        .sanskar-card .s-badge.purple { background: #8e44ad; }

        .sanskar-card .s-desc {
            background: #f8f4f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .sanskar-card .s-desc strong { color: var(--maroon); }

        .sanskar-card .s-vidhi {
            background: #eef7ee;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .sanskar-card .s-vidhi strong { color: #27ae60; }

        .sanskar-card .s-benefits {
            background: #fef8e8;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .sanskar-card .s-benefits strong { color: #d68910; }

        .sanskar-card .s-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);

        .sanskar-card .s-meta span {
            font-size: 10px;
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 10px;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sanskar-card .s-meta span i {
            color: var(--gold);
            font-size: 10px;
        }

        .sanskar-details {
            margin-top: 8px;
        }

            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--maroon);
            padding: 6px 0;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;

        .sanskar-details summary::before {
            content: '➕';
            font-size: 11px;
            transition: transform 0.3s;
        }
        .sanskar-details[open] summary::before {
            content: '➖';
        }
        .sanskar-details .d-body {
            padding: 10px 0;
            font-size: 12.5px;
            color: var(--ink-soft);
            line-height: 1.8;
            background: var(--bg);
            padding: 12px;
            border-radius: 10px;
            margin-top: 6px;
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-light);
            font-size: 14px;
        }
        .no-result i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);
        }

        @media (max-width: 420px) {
            .sanskar-card { padding: 14px 12px; }
            .sanskar-card .s-title { font-size: 16px; }
            .sanskar-card .s-desc,
            .sanskar-card .s-vidhi,
            .sanskar-card .s-benefits { font-size: 12px; }
        }
    </style>
</head>

                vidhi: 'बाल काटे जाते हैं। मंत्रों से बच्चे की रक्षा की जाती है।',
                benefits: 'बुद्धि, आरोग्य, और युवावस्था में प्रवेश।',
                category: 'education',
                when: '16वें साल में',
                extra: 'यह संस्कार ब्रह्मचर्य के अंत और गृहस्थ जीवन की ओर पहला कदम है।'
            },

            // ========== विवाह संस्कार ==========
            {
                number: '12',
                title: 'समावर्तन संस्कार',
                en: 'Samavartan Sanskar',
                desc: 'यह संस्कार गुरुकुल से विदा लेने के लिए किया जाता है — जब ब्रह्मचारी गृहस्थ जीवन में प्रवेश करता है।',
                vidhi: 'गुरु को दक्षिणा दी जाती है। गृहस्थ जीवन के नियम बताए जाते हैं। आशीर्वाद लिया जाता है।',
                benefits: 'गृहस्थ जीवन, विवाह की तैयारी, और जिम्मेदारी।',
                category: 'marriage',
                when: 'गुरुकुल से विदा के समय',
                extra: 'यह संस्कार ब्रह्मचारी को गृहस्थ बनने की शिक्षा देता है।'
            },
            {
                number: '13',
                title: 'विवाह संस्कार',
                en: 'Vivah Sanskar',
                desc: 'यह सबसे महत्वपूर्ण संस्कार है — जो पति-पत्नी के पवित्र बंधन के लिए किया जाता है।',
                vidhi: 'वर-वधू को सात वचन (सात फेरे) कराए जाते हैं। सिंदूर, मंगलसूत्र, गठबंधन, और कन्यादान किया जाता है।',
                benefits: 'विवाह, संतान, पारिवारिक सुख, और समाज।',
                category: 'marriage',
                when: 'विवाह के समय',
                extra: 'यह 16 संस्कारों में सबसे महत्वपूर्ण है। सात फेरे सात वचनों के प्रतीक हैं।'
            },

            // ========== अंत्येष्टि संस्कार ==========
            {
                number: '14',
                title: 'विवाहाग्नि संस्कार',
                en: 'Vivahagni Sanskar',
                desc: 'यह विवाह के बाद अग्नि की स्थापना का संस्कार है — जो गृहस्थ जीवन के लिए किया जाता है।',
                vidhi: 'गृहस्थ अग्नि की स्थापना करते हैं। रोज़ अग्निहोत्र करते हैं।',
                benefits: 'गृहस्थ जीवन, पारिवारिक सुख।',
                category: 'marriage',
                when: 'विवाह के बाद',
                extra: 'यह संस्कार गृहस्थ जीवन की शुरुआत है।'
            },
            {
                number: '15',
                title: 'अंत्येष्टि संस्कार',
                en: 'Antyeshti Sanskar',
                desc: 'यह अंतिम संस्कार है — जो मृत्यु के बाद किया जाता है।',
                vidhi: 'मृत शरीर का दाह संस्कार किया जाता है। अस्थियाँ गंगा में विसर्जित की जाती हैं। श्राद्ध कर्म किए जाते हैं।',
                benefits: 'मृत आत्मा की शांति, मोक्ष, और पितृ ऋण।',
                category: 'death',
                when: 'मृत्यु के बाद',
                extra: 'यह संस्कार आत्मा को मोक्ष दिलाने के लिए किया जाता है।'
            },
            {
                number: '16',
                title: 'श्राद्ध संस्कार',
                en: 'Shraddh Sanskar',
                desc: 'यह संस्कार मृत पूर्वजों की शांति के लिए किया जाता है — पितृ पक्ष में विशेष रूप से।',
                vidhi: 'पितरों को पिंडदान, तर्पण, और ब्राह्मण भोजन कराया जाता है। श्राद्ध कर्म किए जाते हैं।',
                benefits: 'पितृ शांति, पितृ दोष नाश, और पुण्य।',
                category: 'death',
                when: 'मृत्यु तिथि, पितृ पक्ष, अमावस्या',
                extra: 'यह संस्कार पितरों की शांति और उनके आशीर्वाद के लिए किया जाता है।'
            }
        ];

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderSanskars() {
            const grid = document.getElementById('sanskarGrid');
            const filtered = sanskars.filter(s => {
                const matchCat = currentCategory === 'all' || s.category === currentCategory;
                const matchSearch = s.title.includes(searchQuery) ||
                                    s.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    s.desc.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई संस्कार नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'birth') return 'gold';
                if (cat === 'childhood') return 'green';
                if (cat === 'education') return 'blue';
                if (cat === 'marriage') return 'purple';
                if (cat === 'death') return '';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'birth': 'जन्म',
                    'childhood': 'बाल्यकाल',
                    'education': 'शिक्षा',
                    'marriage': 'विवाह',
                    'death': 'अंत्येष्टि'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(s => `
                <div class="sanskar-card">
                    <div class="s-header">
                        <div class="s-title">
                            ${s.title}
                            <span class="s-en">${s.en}</span>
                        </div>
                        <span class="s-number">संस्कार ${s.number}</span>
                    </div>
                    <div class="s-desc">
                        <strong>📖 परिचय:</strong> ${s.desc}
                    </div>
                    <div class="s-vidhi">
                        <strong>🙏 विधि:</strong> ${s.vidhi}
                    </div>
                    <div class="s-benefits">
                        <strong>✨ लाभ:</strong> ${s.benefits}
                    </div>
                    <div class="s-meta">
                        <span><i class="fa-solid fa-clock"></i> ${s.when}</span>
                        <span class="s-badge ${badgeClass(s.category)}">${catName(s.category)}</span>
                    </div>
                    <details class="sanskar-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${s.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterSanskars() {
            searchQuery = document.getElementById('sanskarSearch').value.trim();
            renderSanskars();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderSanskars();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderSanskars();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — संस्कार कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
