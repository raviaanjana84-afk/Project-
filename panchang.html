<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>पंचांग — Sanatan Gyan Kosh</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header class="app-header">
        <a href="index.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">
            <span class="eyebrow">🕉️ पंचांग</span>
            <h1>आज का पंचांग</h1>
        </div>
        <button class="icon-btn" id="darkToggle"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
        <div class="card panchang-card">
            <div class="panchang-grid">
                <div class="panchang-item">
                    <p class="panchang-label">वार</p>
                    <p class="panchang-value" id="displayVaar">--</p>
                </div>
                <div class="panchang-item">
                    <p class="panchang-label">तिथि</p>
                    <p class="panchang-value" id="displayTithi">--</p>
                </div>
                <div class="panchang-item">
                    <p class="panchang-label">नक्षत्र</p>
                    <p class="panchang-value" id="displayNakshatra">--</p>
                </div>
                <div class="panchang-item">
                    <p class="panchang-label">योग</p>
                    <p class="panchang-value" id="displayYoga">--</p>
                </div>
                <div class="panchang-item">
                    <p class="panchang-label">करण</p>
                    <p class="panchang-value" id="displayKarana">--</p>
                </div>
            </div>
            <div class="panchang-suryatime" id="displayMuhurat">⏳ लोड हो रहा है...</div>
        </div>

        <div class="card">
            <h3>📖 पंचांग क्या है?</h3>
            <p>पंचांग हिंदू कैलेंडर है जो समय, त्योहार, और शुभ-अशुभ मुहूर्त बताता है। इसमें पाँच अंग होते हैं — वार, तिथि, नक्षत्र, योग, करण।</p>
        </div>

        <a href="index.html" class="btn-primary" style="text-align:center;display:block;text-decoration:none;">🏠 होम पेज पर जाएँ</a>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById('darkToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            this.querySelector('i').classList.toggle('fa-moon');
            this.querySelector('i').classList.toggle('fa-sun');
        });

        // Simple Panchang
        const days = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
        const tithis = ['प्रतिपदा', 'द्वितीया', 'तृतीया', 'चतुर्थी', 'पंचमी', 'षष्ठी', 'सप्तमी', 'अष्टमी', 'नवमी', 'दशमी', 'एकादशी', 'द्वादशी', 'त्रयोदशी', 'चतुर्दशी', 'पूर्णिमा', 'अमावस्या'];
        const nakshatras = ['अश्विनी', 'भरणी', 'कृत्तिका', 'रोहिणी', 'मृगशिरा', 'आर्द्रा', 'पुनर्वसु', 'पुष्य', 'आश्लेषा', 'मघा', 'पूर्वाफाल्गुनी', 'उत्तराफाल्गुनी', 'हस्त', 'चित्रा', 'स्वाति', 'विशाखा', 'अनुराधा', 'ज्येष्ठा', 'मूल', 'पूर्वाषाढ़ा', 'उत्तराषाढ़ा', 'श्रवण', 'धनिष्ठा', 'शतभिषा', 'पूर्वाभाद्रपदा', 'उत्तराभाद्रपदा', 'रेवती'];

        const d = new Date();
        document.getElementById('displayVaar').textContent = days[d.getDay()];
        document.getElementById('displayTithi').textContent = tithis[d.getDate() % 16];
        document.getElementById('displayNakshatra').textContent = nakshatras[d.getDate() % 27];
        document.getElementById('displayYoga').textContent = 'शुभ';
        document.getElementById('displayKarana').textContent = 'सिद्धि';
        document.getElementById('displayMuhurat').textContent = '🌅 सूर्योदय: 6:30 AM, सूर्यास्त: 6:30 PM';
    </script>
</body>
</html>
