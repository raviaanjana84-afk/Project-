            padding-top: 10px;

            font-size: 10px;

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderKathas() {
            const grid = document.getElementById('kathaGrid');
            const filtered = kathas.filter(k => {
                const matchCat = currentCategory === 'all' || k.category === currentCategory;
                const matchSearch = k.title.includes(searchQuery) ||
                                    k.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    k.god.includes(searchQuery) ||
                                    k.desc.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई कथा नहीं मिली। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'ramayan') return 'gold';
                if (cat === 'mahabharat') return 'red';
                if (cat === 'shiv') return 'blue';
                if (cat === 'vishnu') return 'blue';
                if (cat === 'devi') return 'green';
                if (cat === 'ganesh') return 'gold';
                if (cat === 'hanuman') return 'gold';
                if (cat === 'sant') return 'purple';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'ramayan': 'रामायण',
                    'mahabharat': 'महाभारत',
                    'shiv': 'शिव',
                    'vishnu': 'विष्णु',
                    'devi': 'देवी',
                    'ganesh': 'गणेश',
                    'hanuman': 'हनुमान',
                    'sant': 'संत',
                    'lok': 'लोक'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(k => `
                <div class="katha-card">
                    <div class="k-header">
                        <div class="k-title">
                            ${k.title}
                            <span class="k-en">${k.en}</span>
                        </div>
                        <span class="k-badge ${badgeClass(k.category)}">${catName(k.category)}</span>
                    </div>
                    <div class="k-desc">
                        <strong>📖 कथा:</strong> ${k.desc}
                    </div>
                    <div class="k-shiksha">
                        <strong>🎓 शिक्षा:</strong> ${k.shiksha}
                    </div>
                    <div class="k-meta">
                        <span><i class="fa-solid fa-om"></i> ${k.god}</span>
                        <span><i class="fa-solid fa-book"></i> ${k.source}</span>
                    </div>
                    <details class="katha-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${k.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterKathas() {
            searchQuery = document.getElementById('kathaSearch').value.trim();
            renderKathas();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderKathas();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderKathas();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — कथा कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
