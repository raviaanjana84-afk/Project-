        .search-wrap {

        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;

            scrollbar-width: none;

        }
        .cat-tab:hover:not(.active) {

            color: var(--maroon);
        }

        .niyam-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .niyam-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 5px solid var(--gold);
            transition: var(--transition);

        .niyam-card:hover {

            box-shadow: var(--shadow-hover);
            border-left-color: var(--maroon);
        }

            font-size: 10px;
            font-weight: 400;
            color: var(--ink-light);

            margin-top: 2px;

            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;

        .niyam-card .n-badge.blue { background: #2980b9; }
        .niyam-card .n-badge.purple { background: #8e44ad; }

            list-style: none;
            padding: 0;
            margin: 0;

        .niyam-card .n-list li {
            padding: 8px 0;
            font-size: 13.5px;
            line-height: 1.7;
            border-bottom: 1px dashed var(--border);
            color: var(--ink-soft);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .niyam-card .n-list li:last-child { border-bottom: none; }
        .niyam-card .n-list li .tick {
            color: #27ae60;
            font-weight: 700;
            flex-shrink: 0;
            font-size: 14px;
        }
        .niyam-card .n-list li .cross {
            color: #dc3545;
            font-weight: 700;
            flex-shrink: 0;
            font-size: 14px;
        }
        .niyam-card .n-list li strong {
            color: var(--maroon);
        }

        .niyam-card .n-warning {
            background: #fdecea;
            border-left: 4px solid #dc3545;
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
            color: #721c24;
            line-height: 1.7;

            text-align: center;
            padding: 40px 20px;

            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderNiyams() {
            const grid = document.getElementById('niyamGrid');
            const filtered = niyams.filter(n => {
                const matchCat = currentCategory === 'all' || n.category === currentCategory;
                const matchSearch = n.title.includes(searchQuery) ||
                                    n.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    n.rules.some(r => r.text.includes(searchQuery));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई नियम नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'daily') return 'gold';
                if (cat === 'puja') return 'blue';
                if (cat === 'granth') return 'purple';
                if (cat === 'food') return 'green';
                if (cat === 'daily-life') return 'gold';
                if (cat === 'special') return 'purple';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'daily': 'दिनचर्या',
                    'puja': 'पूजा',
                    'granth': 'ग्रंथ पाठ',
                    'food': 'भोजन',
                    'daily-life': 'दैनिक जीवन',
                    'special': 'विशेष'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(n => `
                <div class="niyam-card">
                    <div class="n-header">
                        <div class="n-title">
                            ${n.title}
                            <span class="n-en">${n.en}</span>
                        </div>
                        <span class="n-badge ${badgeClass(n.category)}">${catName(n.category)}</span>
                    </div>
                    <ul class="n-list">
                        ${n.rules.map(r => `
                            <li>
                                <span class="${r.type === 'do' ? 'tick' : 'cross'}">
                                    ${r.type === 'do' ? '✅' : '❌'}
                                </span>
                                <span>${r.text}</span>
                            </li>
                        `).join('')}
                    </ul>
                    ${n.warning ? `<div class="n-warning"><strong>⚠️ ध्यान दें:</strong> ${n.warning}</div>` : ''}
                </div>
            `).join('');
        }

        function filterNiyams() {
            searchQuery = document.getElementById('niyamSearch').value.trim();
            renderNiyams();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderNiyams();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderNiyams();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — नियम कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
