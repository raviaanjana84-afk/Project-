        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);

            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);

        .search-wrap input::placeholder { color: var(--ink-light); }

            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);

            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);

            font-weight: 400;
            color: var(--ink-light);
            display: block;

            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;

            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;

            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;

            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;

        .vrat-card .v-benefits strong { color: #d68910; }

            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;

            background: var(--bg);
            padding: 4px 10px;
            border-radius: 10px;
            color: var(--ink-soft);

            align-items: center;
            gap: 4px;

            font-size: 40px;

            .vrat-card .v-title { font-size: 16px; }

</head>

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderVrats() {
            const grid = document.getElementById('vratGrid');
            const filtered = vrats.filter(v => {
                const matchCat = currentCategory === 'all' || v.category === currentCategory;
                const matchSearch = v.title.includes(searchQuery) ||
                                    v.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    v.god.includes(searchQuery) ||
                                    v.desc.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई व्रत नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'weekly') return 'gold';
                if (cat === 'monthly') return 'green';
                if (cat === 'annual') return 'blue';
                if (cat === 'special') return 'purple';
                if (cat === 'stri') return 'red';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'weekly': 'साप्ताहिक',
                    'monthly': 'मासिक',
                    'annual': 'वार्षिक',
                    'special': 'विशेष',
                    'stri': 'स्त्री व्रत'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(v => `
                <div class="vrat-card">
                    <div class="v-header">
                        <div class="v-title">
                            ${v.title}
                            <span class="v-en">${v.en}</span>
                        </div>
                        <span class="v-badge ${badgeClass(v.category)}">${catName(v.category)}</span>
                    </div>
                    <div class="v-desc">
                        <strong>📖 परिचय:</strong> ${v.desc}
                    </div>
                    <div class="v-vidhi">
                        <strong>🙏 व्रत विधि:</strong> ${v.vidhi}
                    </div>
                    <div class="v-benefits">
                        <strong>✨ लाभ:</strong> ${v.benefits}
                    </div>
                    <div class="v-meta">
                        <span><i class="fa-solid fa-om"></i> ${v.god}</span>
                        <span><i class="fa-solid fa-calendar"></i> ${v.when}</span>
                        <span><i class="fa-solid fa-clock"></i> ${v.days}</span>
                    </div>
                    <details class="vrat-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${v.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterVrats() {
            searchQuery = document.getElementById('vratSearch').value.trim();
            renderVrats();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderVrats();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderVrats();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — व्रत कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
