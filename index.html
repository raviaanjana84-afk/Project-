<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebCraft Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
/* ── VARIABLES ── */
:root {
  --gold: #C9A96E;
  --dark: #0D0D0D;
  --dark-2: #141414;
  --dark-3: #1C1C1C;
  --dark-4: #242424;
  --text: #E8E4DC;
  --text-muted: #8A8580;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.4rem 5%;
  border-bottom: 1px solid rgba(201,169,110,0.1);
  background: rgba(13,13,13,0.85);
  backdrop-filter: blur(14px);
  animation: fadeDown 0.8s ease forwards;
}
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; letter-spacing: 0.05em; color: var(--gold); }
.nav-logo span { color: var(--text); font-weight: 300; }
nav ul { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
nav ul a { color: var(--text-muted); text-decoration: none; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.3s; }
nav ul a:hover { color: var(--gold); }
.nav-cta { background: transparent; border: 1px solid var(--gold); color: var(--gold) !important; padding: 0.45rem 1.2rem; border-radius: 2px; transition: background 0.3s, color 0.3s !important; }
.nav-cta:hover { background: var(--gold) !important; color: var(--dark) !important; }

/* ── LANG TOGGLE ── */
.lang-toggle {
  display: flex;
  gap: 0;
  border: 1px solid rgba(201,169,110,0.3);
  border-radius: 2px;
  overflow: hidden;
}
.lang-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: 'Outfit', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  padding: 0.35rem 0.75rem;
  cursor: pointer;
  transition: background 0.25s, color 0.25s;
  text-transform: uppercase;
}
.lang-btn.active { background: var(--gold); color: var(--dark); font-weight: 600; }

/* ── HERO ── */
#hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8rem 5% 5rem;
  position: relative;
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,169,110,0.08) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(201,169,110,0.04) 0%, transparent 60%);
}
.hero-ring {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(201,169,110,0.06);
  animation: rotate 30s linear infinite;
}
.hero-ring:nth-child(2) { width: 700px; height: 700px; }
.hero-ring:nth-child(3) { width: 500px; height: 500px; animation-direction: reverse; animation-duration: 20s; }
.hero-ring:nth-child(4) { width: 300px; height: 300px; animation-duration: 15s; }
.hero-content { position: relative; z-index: 2; max-width: 820px; }
.hero-eyebrow { display: inline-block; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards; }
.hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(3.2rem, 7vw, 6rem); font-weight: 300; line-height: 1.05; margin-bottom: 1.8rem; opacity: 0; animation: fadeUp 0.9s 0.5s ease forwards; }
.hero-title em { font-style: italic; color: var(--gold); }
.hero-sub { font-size: 1rem; color: var(--text-muted); max-width: 520px; margin: 0 auto 2.8rem; line-height: 1.75; opacity: 0; animation: fadeUp 0.9s 0.7s ease forwards; }
.hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; opacity: 0; animation: fadeUp 0.9s 0.9s ease forwards; }
.hero-scroll { position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.5rem; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); animation: fadeIn 1.5s 1.5s ease forwards; opacity: 0; }
.hero-scroll-line { width: 1px; height: 40px; background: linear-gradient(to bottom, var(--gold), transparent); animation: scrollPulse 2s infinite; }

/* ── BUTTONS ── */
.btn-primary { background: var(--gold); color: var(--dark); padding: 0.85rem 2.4rem; border: none; font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none; border-radius: 2px; transition: opacity 0.3s, transform 0.3s; }
.btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--text); padding: 0.85rem 2.4rem; border: 1px solid rgba(232,228,220,0.2); font-family: 'Outfit', sans-serif; font-size: 0.82rem; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none; border-radius: 2px; transition: border-color 0.3s, color 0.3s; }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

/* ── SECTION BASE ── */
section { padding: 6rem 5%; }
.section-label { font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 4vw, 3.4rem); font-weight: 300; line-height: 1.15; margin-bottom: 1.4rem; }
.section-title em { font-style: italic; color: var(--gold); }
.section-desc { color: var(--text-muted); max-width: 540px; line-height: 1.75; font-size: 0.95rem; }
.divider { width: 48px; height: 1px; background: var(--gold); margin: 1.6rem 0; }

/* ── ABOUT ── */
#about { background: var(--dark-2); display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
.about-visual { position: relative; height: 420px; }
.about-card { position: absolute; border: 1px solid rgba(201,169,110,0.18); background: var(--dark-3); border-radius: 4px; }
.about-card-main { inset: 0 10% 10% 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.about-card-accent { bottom: 0; right: 0; width: 48%; height: 42%; background: var(--dark-4); border-color: rgba(201,169,110,0.3); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.4rem; }
.about-stat-num { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 600; color: var(--gold); line-height: 1; }
.about-stat-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
.about-grid-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; width: 100%; height: 100%; background: rgba(201,169,110,0.1); }
.about-grid-cell { background: var(--dark-3); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; letter-spacing: 0.1em; color: var(--text-muted); text-align: center; padding: 1rem; line-height: 1.4; }
.about-grid-cell.highlight { background: var(--dark-4); color: var(--gold); }
.about-features { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
.about-feature { display: flex; gap: 1rem; align-items: flex-start; }
.about-feature-icon { width: 36px; height: 36px; flex-shrink: 0; border: 1px solid rgba(201,169,110,0.3); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--gold); }
.about-feature-text h4 { font-size: 0.9rem; font-weight: 500; margin-bottom: 0.2rem; }
.about-feature-text p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }

/* ── SERVICES ── */
#services { background: var(--dark); }
.services-header { text-align: center; margin-bottom: 4rem; }
.services-header .section-desc { margin: 0 auto; }
.services-header .divider { margin: 1.6rem auto; }
.packages-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
.package-card { border: 1px solid rgba(201,169,110,0.12); background: var(--dark-2); border-radius: 4px; padding: 2.4rem 2rem; position: relative; transition: transform 0.4s, border-color 0.4s; overflow: hidden; }
.package-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--gold); opacity: 0; transition: opacity 0.4s; }
.package-card:hover { transform: translateY(-6px); border-color: rgba(201,169,110,0.35); }
.package-card:hover::before { opacity: 1; }
.package-card.featured { border-color: rgba(201,169,110,0.4); background: var(--dark-3); }
.package-card.featured::before { opacity: 1; }
.package-badge { display: inline-block; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dark); background: var(--gold); padding: 0.2rem 0.7rem; border-radius: 2px; margin-bottom: 1.4rem; }
.package-badge.outline { color: var(--gold); background: transparent; border: 1px solid rgba(201,169,110,0.3); }
.package-tier { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; margin-bottom: 0.4rem; }
.package-tagline { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1.6rem; line-height: 1.5; }
.package-price { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 300; color: var(--gold); margin-bottom: 0.3rem; }
.package-price sup { font-size: 1.2rem; vertical-align: top; margin-top: 0.5rem; display: inline-block; }
.package-from { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1.8rem; }
.package-divider { height: 1px; background: rgba(201,169,110,0.12); margin-bottom: 1.6rem; }
.package-features { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 2rem; }
.package-features li { font-size: 0.83rem; color: var(--text-muted); display: flex; gap: 0.7rem; align-items: flex-start; line-height: 1.5; }
.package-features li::before { content: '—'; color: var(--gold); flex-shrink: 0; }
.package-features li.active { color: var(--text); }
.pkg-btn { display: block; text-align: center; padding: 0.8rem 1.5rem; border-radius: 2px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; font-family: 'Outfit', sans-serif; font-weight: 500; transition: all 0.3s; }
.pkg-btn-gold { background: var(--gold); color: var(--dark); }
.pkg-btn-gold:hover { opacity: 0.85; }
.pkg-btn-outline { border: 1px solid rgba(201,169,110,0.3); color: var(--gold); }
.pkg-btn-outline:hover { background: rgba(201,169,110,0.1); }

/* ── NICHES ── */
#niches { background: var(--dark-2); text-align: center; }
.niches-header { margin-bottom: 3rem; }
.niches-header .divider { margin: 1.6rem auto; }
.niches-header .section-desc { margin: 0 auto; }
.niches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: rgba(201,169,110,0.08); max-width: 900px; margin: 0 auto; border: 1px solid rgba(201,169,110,0.08); border-radius: 4px; overflow: hidden; }
.niche-item { background: var(--dark-2); padding: 2rem 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.7rem; transition: background 0.3s; }
.niche-item:hover { background: var(--dark-3); }
.niche-icon { font-size: 1.6rem; }
.niche-name { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }

/* ── CONTACT ── */
#contact { background: var(--dark); display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; }
.contact-info .section-desc { margin-bottom: 2rem; }
.contact-detail { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.2rem; }
.contact-detail-icon { width: 38px; height: 38px; flex-shrink: 0; border: 1px solid rgba(201,169,110,0.25); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--gold); }
.contact-detail-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
.contact-detail-text strong { display: block; color: var(--text); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.15rem; }
.contact-form { display: flex; flex-direction: column; gap: 1.2rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { display: flex; flex-direction: column; gap: 0.4rem; }
.form-group label { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea { background: var(--dark-2); border: 1px solid rgba(201,169,110,0.15); color: var(--text); padding: 0.75rem 1rem; font-family: 'Outfit', sans-serif; font-size: 0.88rem; border-radius: 2px; outline: none; transition: border-color 0.3s; appearance: none; }
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); opacity: 0.6; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
.form-group select option { background: var(--dark-2); }
.form-group textarea { resize: vertical; min-height: 110px; }
.form-submit { background: var(--gold); color: var(--dark); border: none; padding: 0.95rem 2.5rem; font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border-radius: 2px; align-self: flex-start; transition: opacity 0.3s, transform 0.3s; }
.form-submit:hover { opacity: 0.85; transform: translateY(-2px); }

/* ── FOOTER ── */
footer { background: var(--dark-2); border-top: 1px solid rgba(201,169,110,0.1); padding: 2.5rem 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: var(--gold); }
.footer-logo span { color: var(--text); font-weight: 300; }
footer p { font-size: 0.75rem; color: var(--text-muted); }

/* ── ANIMATIONS ── */
@keyframes rotate { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scrollPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  #about, #contact { grid-template-columns: 1fr; gap: 3rem; }
  .about-visual { height: 280px; }
  .packages-grid { grid-template-columns: 1fr; max-width: 440px; }
  nav ul { display: none; }
}

</style>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <div class="nav-logo">WebCraft<span> Studio</span></div>
  <ul>
    <li><a href="#about" id="nav-about">About</a></li>
    <li><a href="#services" id="nav-services">Services</a></li>
    <li><a href="#niches" id="nav-niches">Niches</a></li>
    <li><a href="#contact" id="nav-contact" class="nav-cta">Get Started</a></li>
  </ul>
  <!-- Language Toggle -->
  <div class="lang-toggle">
    <button class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="hi" onclick="setLang('hi')">हि</button>
  </div>
</nav>

<!-- ══ HERO ══ -->
<section id="hero">
  <div class="hero-bg"></div>
  <div class="hero-ring"></div>
  <div class="hero-ring"></div>
  <div class="hero-ring"></div>
  <div class="hero-content">
    <span class="hero-eyebrow" id="hero-eyebrow"></span>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-btns">
      <a href="#services" class="btn-primary" id="hero-btn-primary"></a>
      <a href="#contact" class="btn-ghost" id="hero-btn-ghost"></a>
    </div>
  </div>
  <div class="hero-scroll">
    <div class="hero-scroll-line"></div>
    <span id="hero-scroll"></span>
  </div>
</section>

<!-- ══ ABOUT ══ -->
<section id="about">
  <div class="about-visual reveal">
    <div class="about-card about-card-main">
      <div class="about-grid-inner">
        <div class="about-grid-cell highlight" id="grid-design"></div>
        <div class="about-grid-cell" id="grid-dev"></div>
        <div class="about-grid-cell" id="grid-seo"></div>
        <div class="about-grid-cell highlight" id="grid-mobile"></div>
      </div>
    </div>
    <div class="about-card about-card-accent">
      <div class="about-stat-num">50+</div>
      <div class="about-stat-label" id="about-stat"></div>
    </div>
  </div>
  <div class="about-text reveal">
    <div class="section-label" id="about-label"></div>
    <h2 class="section-title" id="about-title"></h2>
    <div class="divider"></div>
    <p class="section-desc" id="about-desc"></p>
    <div class="about-features">
      <div class="about-feature">
        <div class="about-feature-icon">✦</div>
        <div class="about-feature-text">
          <h4 id="f1-title"></h4>
          <p id="f1-desc"></p>
        </div>
      </div>
      <div class="about-feature">
        <div class="about-feature-icon">◈</div>
        <div class="about-feature-text">
          <h4 id="f2-title"></h4>
          <p id="f2-desc"></p>
        </div>
      </div>
      <div class="about-feature">
        <div class="about-feature-icon">⬡</div>
        <div class="about-feature-text">
          <h4 id="f3-title"></h4>
          <p id="f3-desc"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ══ SERVICES ══ -->
<section id="services">
  <div class="services-header reveal">
    <div class="section-label" id="srv-label"></div>
    <h2 class="section-title" id="srv-title"></h2>
    <div class="divider"></div>
    <p class="section-desc" id="srv-desc"></p>
  </div>
  <div class="packages-grid">

    <!-- BASIC -->
    <div class="package-card reveal">
      <span class="package-badge outline" id="basic-badge"></span>
      <div class="package-tier" id="basic-tier"></div>
      <p class="package-tagline" id="basic-tagline"></p>
      <div class="package-price"><sup>$</sup>299</div>
      <div class="package-from" id="basic-from"></div>
      <div class="package-divider"></div>
      <ul class="package-features">
        <li class="active" id="f-3pages"></li>
        <li class="active" id="f-mobile-b"></li>
        <li class="active" id="f-contact-b"></li>
        <li class="active" id="f-seo-b"></li>
        <li id="f-ecom-b"></li>
        <li id="f-anim-b"></li>
        <li id="f-priority-b"></li>
      </ul>
      <a href="#contact" class="pkg-btn pkg-btn-outline" id="pkg-btn-b"></a>
    </div>

    <!-- ADVANCED -->
    <div class="package-card featured reveal">
      <span class="package-badge" id="adv-badge"></span>
      <div class="package-tier" id="adv-tier"></div>
      <p class="package-tagline" id="adv-tagline"></p>
      <div class="package-price"><sup>$</sup>699</div>
      <div class="package-from" id="adv-from"></div>
      <div class="package-divider"></div>
      <ul class="package-features">
        <li class="active" id="f-8pages"></li>
        <li class="active" id="f-mobile-a"></li>
        <li class="active" id="f-contact-a"></li>
        <li class="active" id="f-seo-a"></li>
        <li class="active" id="f-ecom-a"></li>
        <li class="active" id="f-anim-a"></li>
        <li id="f-priority-a"></li>
      </ul>
      <a href="#contact" class="pkg-btn pkg-btn-gold" id="pkg-btn-a"></a>
    </div>

    <!-- PREMIUM -->
    <div class="package-card reveal">
      <span class="package-badge outline" id="prem-badge"></span>
      <div class="package-tier" id="prem-tier"></div>
      <p class="package-tagline" id="prem-tagline"></p>
      <div class="package-price"><sup>$</sup>1,499</div>
      <div class="package-from" id="prem-from"></div>
      <div class="package-divider"></div>
      <ul class="package-features">
        <li class="active" id="f-unlimited"></li>
        <li class="active" id="f-mobile-p"></li>
        <li class="active" id="f-contact-p"></li>
        <li class="active" id="f-seo-p"></li>
        <li class="active" id="f-ecom-p"></li>
        <li class="active" id="f-anim-p"></li>

// ── SCROLL REVEAL ──
function initScrollReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) {
        setTimeout(() => e.target.classList.add('visible'), i * 80);
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  reveals.forEach(el => observer.observe(el));
}

// ── CONTACT FORM ──
function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const t = translations[currentLang];
  btn.textContent = t.submitSuccess;
  btn.style.background = '#4a7c59';
  btn.style.color = '#fff';
  setTimeout(() => {
    btn.innerHTML = t.submitBtn;
    btn.style.background = '';
    btn.style.color = '';
  }, 3000);
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  initScrollReveal();
  setLang('en');
});
