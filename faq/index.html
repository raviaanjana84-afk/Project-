    <style>
        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        .faq-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .faq-item {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
        }
        .faq-item:hover {
            border-color: var(--gold);
        }
        .faq-question {
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            color: var(--maroon);
            line-height: 1.5;
            transition: var(--transition);
        }
        .faq-question:hover {
            background: var(--bg);
        }
        .faq-question .q-icon {
            flex-shrink: 0;
            font-size: 18px;
            color: var(--gold);
            transition: transform 0.3s;
            margin-top: 2px;
        }
        .faq-item.open .faq-question .q-icon {
            transform: rotate(180deg);
        }
        .faq-item.open .faq-question {
            background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(122,46,46,0.05));
            border-bottom: 1px solid var(--border);
        }
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 18px;
            font-size: 13.5px;
            line-height: 1.8;
            color: var(--ink-soft);
        }
        .faq-item.open .faq-answer {
            max-height: 2000px;
            padding: 16px 18px;
        }
        .faq-answer strong { color: var(--maroon); }
        .faq-answer ul {
            list-style: none;
            padding: 0;
            margin-top: 8px;
        }
        .faq-answer ul li {
            padding: 4px 0 4px 24px;
            position: relative;
        }
        .faq-answer ul li::before {
            content: '🕉️';
            position: absolute;
            left: 0;
            font-size: 12px;
        }
        .faq-answer a {
            color: var(--maroon);
            text-decoration: underline;
            font-weight: 600;
        }
        .faq-category-tag {
            display: inline-block;
            font-size: 9px;
            background: var(--gold);
            color: var(--maroon);
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: var(--font-body);
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-light);
            font-size: 14px;
        }
        .no-result i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);
        }

        /* Stats */
        .faq-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .faq-stat {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .faq-stat .fs-num {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--maroon);
        }
        .faq-stat .fs-label {
            font-size: 10px;
            color: var(--ink-soft);
            text-transform: uppercase;
            margin-top: 2px;
        }

        @media (max-width: 420px) {
            .faq-question { font-size: 13.5px; padding: 14px 14px; }
            .faq-answer { font-size: 12.5px; }
            .faq-item.open .faq-answer { padding: 14px 14px; }
        }
    </style>
</head>

                cat: 'general',
                q: 'हिंदू धर्म में दान का महत्व क्या है?',
                a: '<strong>दान</strong> हिंदू धर्म में सबसे बड़ा पुण्य माना जाता है।<br><br><strong>प्रकार:</strong><br><ul><li>अन्न दान — सबसे बड़ा</li><li>विद्या दान</li><li>भूमि दान</li><li>गौ दान</li><li>वस्त्र दान</li><li>धन दान</li></ul><br><strong>लाभ:</strong> पाप नाश, पुण्य, मोक्ष, संतान, धन।<br><br><strong>श्रेष्ठ दान:</strong> जो गुप्त रूप से, श्रद्धा से, योग्य व्यक्ति को दिया जाए।'
            },
            {
                cat: 'general',
                q: 'गंगा जल क्यों पवित्र माना जाता है?',
                a: '<strong>गंगा जल पवित्र है</strong> — धार्मिक और वैज्ञानिक दोनों कारणों से:<br><br><strong>धार्मिक:</strong><br><ul><li>विष्णु के चरणों से प्रकट</li><li>शिव की जटाओं में विराजमान</li><li>मोक्ष का द्वार</li></ul><br><strong>वैज्ञानिक:</strong><br><ul><li>बैक्टीरियोफेज — जो हानिकारक बैक्टीरिया नष्ट करते हैं</li><li>ऑक्सीजन की अधिकता</li><li>कभी खराब नहीं होता</li></ul>'
            },
            {
                cat: 'general',
                q: 'हिंदू धर्म में तुलसी का महत्व क्या है?',
                a: '<strong>तुलसी माता</strong> हिंदू धर्म की सबसे पवित्र देवी हैं।<br><br><strong>महत्व:</strong><br><ul><li>हर घर के आँगन में विराजमान</li><li>विष्णु की प्रिया</li><li>स्वास्थ्य, भक्ति, समृद्धि की प्रतीक</li><li>औषधीय गुणों से भरपूर</li><li>घर में सकारात्मक ऊर्जा</li></ul><br><strong>वैज्ञानिक लाभ:</strong> सर्दी-खांसी, रोग प्रतिरोधक क्षमता, तनाव, और रक्तचाप में लाभ।'
            },
            {
                cat: 'general',
                q: 'सनातन धर्म और हिंदू धर्म में क्या अंतर है?',
                a: '<strong>सनातन धर्म</strong> और <strong>हिंदू धर्म</strong> एक ही हैं — बस नाम अलग है।<br><br><strong>सनातन धर्म:</strong> शाश्वत, अनादि, कालातीत<br><strong>हिंदू धर्म:</strong> सिंधु नदी से उत्पन्न, भौगोलिक नाम<br><br><strong>मूल:</strong> वेद, उपनिषद, पुराण, गीता, रामायण, महाभारत।<br><br>सनातन धर्म <strong>विश्व का सबसे प्राचीन धर्म</strong> माना जाता है — 5000+ वर्ष पुराना।'
            },
            {
                cat: 'general',
                q: 'हिंदू धर्म में कितने देवता हैं?',
                a: '<strong>हिंदू धर्म में 33 करोड़ देवता</strong> माने जाते हैं।<br><br><strong>परन्तु:</strong> ये सभी <strong>एक ईश्वर</strong> के ही रूप हैं।<br><br><strong>मुख्य:</strong><br><ul><li>त्रिदेव — ब्रह्मा, विष्णु, महेश</li><li>त्रिदेवी — लक्ष्मी, सरस्वती, पार्वती</li><li>नवदुर्गा, नवग्रह, अष्टविनायक</li></ul><br><strong>वेद:</strong> "एकं सद्विप्रा बहुधा वदन्ति" — सत्य एक है, विद्वान उसे अनेक नामों से बुलाते हैं।'
            }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderFAQs() {
            const grid = document.getElementById('faqGrid');
            const filtered = faqData.filter(f => {
                const matchCat = currentCategory === 'all' || f.cat === currentCategory;
                const matchSearch = f.q.includes(searchQuery) ||
                                    f.a.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई सवाल नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const catName = (cat) => {
                const names = {
                    'puja': '🪔 पूजा',
                    'mantra': '📿 मंत्र',
                    'devta': '🕉️ देवता',
                    'vrat': '🛕 व्रत',
                    'tyohar': '🎉 त्योहार',
                    'jyotish': '🔮 ज्योतिष',
                    'sanskar': '🎊 संस्कार',
                    'daily': '🌅 दिनचर्या',
                    'general': '💡 सामान्य'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map((f, i) => `
                <div class="faq-item" onclick="toggleFAQ(this)">
                    <div class="faq-question">
                        <span>${f.q}</span>
                        <i class="fa-solid fa-chevron-down q-icon"></i>
                    </div>
                    <div class="faq-answer">
                        <span class="faq-category-tag">${catName(f.cat)}</span>
                        ${f.a}
                    </div>
                </div>
            `).join('');

            // Update stats
            document.getElementById('statTotal').textContent = faqData.length;
            document.getElementById('statCategory').textContent = 9;
        }

        function toggleFAQ(el) {
            el.classList.toggle('open');
        }

        function filterFAQs() {
            searchQuery = document.getElementById('faqSearch').value.trim();
            renderFAQs();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderFAQs();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderFAQs();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — FAQ',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
