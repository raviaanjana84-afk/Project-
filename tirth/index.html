        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderTirths() {
            const grid = document.getElementById('tirthGrid');
            const filtered = tirths.filter(t => {
                const matchCat = currentCategory === 'all' || t.category === currentCategory;
                const matchSearch = t.title.includes(searchQuery) ||
                                    t.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    t.location.includes(searchQuery) ||
                                    t.god.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई तीर्थ नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'char-dham') return 'gold';
                if (cat === 'jyotirlinga') return 'blue';
                if (cat === 'shakti') return 'green';
                if (cat === 'kumbh') return 'blue';
                if (cat === 'saptapuri') return 'purple';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'char-dham': 'चार धाम',
                    'jyotirlinga': 'ज्योतिर्लिंग',
                    'shakti': 'शक्तिपीठ',
                    'kumbh': 'कुंभ स्थल',
                    'saptapuri': 'सप्तपुरी',
                    'other': 'अन्य'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(t => `
                <div class="tirth-card">
                    <div class="t-header">
                        <div class="t-title">
                            ${t.title}
                            <span class="t-en">${t.en}</span>
                        </div>
                        <span class="t-badge ${badgeClass(t.category)}">${catName(t.category)}</span>
                    </div>
                    <div class="t-location">
                        <i class="fa-solid fa-location-dot"></i> ${t.location}
                    </div>
                    <div class="t-desc">
                        <strong>📖 परिचय:</strong> ${t.desc}
                    </div>
                    <div class="t-benefits">
                        <strong>✨ लाभ:</strong> ${t.benefits}
                    </div>
                    <div class="t-meta">
                        <span><i class="fa-solid fa-om"></i> ${t.god}</span>
                        <span><i class="fa-solid fa-calendar"></i> ${t.when}</span>
                    </div>
                    <details class="tirth-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${t.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterTirths() {
            searchQuery = document.getElementById('tirthSearch').value.trim();
            renderTirths();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderTirths();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderTirths();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — तीर्थ कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
