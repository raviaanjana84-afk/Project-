    <style>
        /* Search + Filter */
        .search-wrap {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .search-wrap i { color: var(--gold); font-size: 18px; }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);
        }
        .search-wrap input::placeholder { color: var(--ink-light); }

        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 14px;
            scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);
            color: var(--maroon);
        }

        /* Mantra Grid */
        .mantra-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .mantra-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 5px solid var(--gold);
            transition: var(--transition);
            position: relative;
        }
        .mantra-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-left-color: var(--maroon);
        }
        .mantra-card .m-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
        }
        .mantra-card .m-title {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--maroon);
            font-weight: 700;
            flex: 1;
        }
        .mantra-card .m-title .m-en {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            color: var(--ink-light);
            display: block;
            margin-top: 2px;
        }
        .mantra-card .m-badge {
            font-size: 9px;
            background: var(--maroon);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .mantra-card .m-badge.gold { background: var(--gold); color: var(--maroon); }
        .mantra-card .m-badge.green { background: #27ae60; }
        .mantra-card .m-badge.blue { background: #2980b9; }

        .mantra-card .m-devanagari {
            background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(122,46,46,0.05));
            border-left: 3px solid var(--gold);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--maroon);
            text-align: center;
            line-height: 1.8;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .mantra-card .m-meaning {
            background: #f8f4f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .mantra-card .m-meaning strong { color: var(--maroon); }

        .mantra-card .m-benefits {
            background: #eef7ee;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .mantra-card .m-benefits strong { color: #27ae60; }
        .mantra-card .m-benefits i { color: #27ae60; margin-right: 4px; }

        .mantra-card .m-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }
        .mantra-card .m-meta span {
            font-size: 10px;
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 10px;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 4px;

        .mantra-card .m-meta span i {
            color: var(--gold);
            font-size: 10px;
        }

        .mantra-details {
            margin-top: 8px;
        }
        .mantra-details summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--maroon);
            padding: 6px 0;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mantra-details summary::-webkit-details-marker { display: none; }
        .mantra-details summary::before {
            content: '➕';
            font-size: 11px;
            transition: transform 0.3s;
        }
        .mantra-details[open] summary::before {
            content: '➖';
        }
        .mantra-details .d-body {
            padding: 8px 0;
            font-size: 12.5px;
            color: var(--ink-soft);
            line-height: 1.7;
        }

        .section-head {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--maroon);
            margin: 20px 0 10px;

            align-items: center;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gold);

        .section-head .sec-icon { font-size: 24px; }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-light);
            font-size: 14px;
        }
        .no-result i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            color: var(--border);
        }

            .mantra-card { padding: 14px 12px; }
            .mantra-card .m-title { font-size: 16px; }
            .mantra-card .m-devanagari { font-size: 14px; }
            .mantra-card .m-meaning,
            .mantra-card .m-benefits { font-size: 12px; }
        }

                meaning: 'आप ही माता हैं, आप ही पिता हैं, आप ही बंधु और सखा हैं, आप ही विद्या और धन हैं, आप ही सब कुछ हैं, हे देवदेव।',
                benefits: 'भक्ति, समर्पण, ईश्वर कृपा।',
                category: 'vedic',
                god: 'सर्वव्यापी',
                howTo: 'प्रातः/सायं, 3 बार।',
                extra: 'यह भगवान को समर्पण का मंत्र है — हर पूजा में पढ़ें।'
            },
            {
                title: 'कराग्रे वसते लक्ष्मीः',
                en: 'Karagre Vasate Lakshmi',
                devanagari: 'कराग्रे वसते लक्ष्मीः ।<br>करमध्ये सरस्वती ।<br>करमूले तु गोविन्दः ।<br>प्रभाते करदर्शनम् ॥',
                meaning: 'हाथ के अग्रभाग में लक्ष्मी, मध्य में सरस्वती, मूल में गोविंद — प्रातः हाथ देखना शुभ है।',
                benefits: 'सुबह उठकर हाथ देखने से धन, विद्या, और विष्णु कृपा।',
                category: 'vedic',
                god: 'लक्ष्मी, सरस्वती, विष्णु',
                howTo: 'प्रातः उठकर हाथ देखते समय।',
                extra: 'यह सुबह का मंगल मंत्र है — दिन की शुभ शुरुआत।'
            },
            {
                title: 'समुद्र वसने देवि',
                en: 'Samudra Vasane Devi',
                devanagari: 'समुद्र वसने देवि ।<br>पर्वत स्तन मण्डले ।<br>विष्णु पत्नि नमस्तुभ्यं ।<br>पादस्पर्शं क्षमस्व मे ॥',
                meaning: 'हे समुद्र वस्त्रा, पर्वत स्तन वाली, विष्णु पत्नी पृथ्वी — आपको नमस्कार, मेरे पैरों के स्पर्श को क्षमा करें।',
                benefits: 'पृथ्वी माता की क्षमा, दिन की शुभ शुरुआत।',
                category: 'vedic',
                god: 'पृथ्वी माता',

            {
                title: 'ॐ शांतिः शांतिः शांतिः',
                en: 'Om Shanti Shanti Shanti',
                devanagari: 'ॐ शांतिः शांतिः शांतिः',
                meaning: 'ॐ शांति, शांति, शांति।',
                benefits: 'मन की शांति, सकारात्मक ऊर्जा।',
                category: 'vedic',
                god: 'सर्वव्यापी',
                howTo: 'किसी भी समय, 3 बार।',
                extra: 'यह तीन प्रकार की शांति के लिए है — आधिदैविक, आधिभौतिक, आध्यात्मिक।'
            }
        ];

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderMantras() {
            const grid = document.getElementById('mantraGrid');
            const filtered = mantras.filter(m => {
                const matchCat = currentCategory === 'all' || m.category === currentCategory;
                const matchSearch = m.title.includes(searchQuery) ||
                                    m.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    m.devanagari.includes(searchQuery) ||
                                    m.god.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई मंत्र नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'vedic') return 'gold';
                if (cat === 'shiva' || cat === 'mahakal') return 'blue';
                if (cat === 'devi') return 'green';
                return '';
            };

            grid.innerHTML = filtered.map(m => `
                <div class="mantra-card">
                    <div class="m-header">
                        <div class="m-title">
                            ${m.title}
                            <span class="m-en">${m.en}</span>
                        </div>
                        <span class="m-badge ${badgeClass(m.category)}">${m.god}</span>
                    </div>
                    <div class="m-devanagari">${m.devanagari}</div>
                    <div class="m-meaning">
                        <strong>📖 अर्थ:</strong> ${m.meaning}
                    </div>
                    <div class="m-benefits">
                        <strong>✨ लाभ:</strong> ${m.benefits}
                    </div>
                    <div class="m-meta">
                        <span><i class="fa-solid fa-clock"></i> ${m.howTo}</span>
                        <span><i class="fa-solid fa-om"></i> ${m.god}</span>
                    </div>
                    <details class="mantra-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${m.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterMantras() {
            searchQuery = document.getElementById('mantraSearch').value.trim();
            renderMantras();
        }

        // Category tabs
        document.addEventListener('DOMContentLoaded', function() {
            renderMantras();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderMantras();
                });
            });
        });

        // Dark mode toggle
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        // Share function
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — मंत्र कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
