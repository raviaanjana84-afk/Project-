        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderJyotish() {
            const grid = document.getElementById('jyotishGrid');
            const filtered = jyotishItems.filter(j => {
                const matchCat = currentCategory === 'all' || j.category === currentCategory;
                const matchSearch = j.title.includes(searchQuery) ||
                                    j.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    j.desc.includes(searchQuery) ||
                                    j.info.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई जानकारी नहीं मिली। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'rashi') return 'gold';
                if (cat === 'grah') return 'blue';
                if (cat === 'nakshatra') return 'purple';
                if (cat === 'ratna') return 'green';
                if (cat === 'upay') return 'blue';
                if (cat === 'vastu') return 'gold';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'rashi': 'राशि',
                    'grah': 'ग्रह',
                    'nakshatra': 'नक्षत्र',
                    'ratna': 'रत्न',
                    'upay': 'उपाय',
                    'vastu': 'वास्तु'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(j => {
                let metaHtml = '';
                if (j.meta) {
                    metaHtml = Object.entries(j.meta).map(([k, v]) => 
                        `<span><i class="fa-solid fa-circle-dot"></i> <strong>${k}:</strong> ${v}</span>`
                    ).join('');
                }

                return `
                    <div class="jyotish-card">
                        <div class="j-header">
                            <div class="j-title">
                                ${j.title}
                                <span class="j-en">${j.en}</span>
                            </div>
                            <span class="j-badge ${badgeClass(j.category)}">${catName(j.category)}</span>
                        </div>
                        <div class="j-desc">
                            <strong>📖 परिचय:</strong> ${j.desc}
                        </div>
                        <div class="j-info">
                            <strong>✨ विशेषता:</strong> ${j.info}
                        </div>
                        <div class="j-meta">
                            ${metaHtml}
                        </div>
                        <details class="jyotish-details">
                            <summary>अधिक जानकारी</summary>
                            <div class="d-body">${j.extra || ''}</div>
                        </details>
                    </div>
                `;
            }).join('');
        }

        function filterJyotish() {
            searchQuery = document.getElementById('jyotishSearch').value.trim();
            renderJyotish();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderJyotish();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderJyotish();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — ज्योतिष कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
</body>
</html>
