        .search-wrap {

            font-size: 14px;
            background: transparent;
            font-family: var(--font-body);
            color: var(--ink);

            border: 1.5px solid var(--border);
            background: var(--card-bg);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--ink-soft);
            font-family: var(--font-body);
        }
        .cat-tab.active {
            background: var(--maroon);
            color: white;
            border-color: var(--maroon);
        }
        .cat-tab:hover:not(.active) {
            border-color: var(--gold);

            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;

            font-size: 14px;
            color: var(--maroon);
            text-align: center;
            line-height: 1.8;
            margin-bottom: 10px;
            font-weight: 600;

            font-size: 13px;
            color: var(--ink-soft);

            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.7;
            margin-bottom: 8px;

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================

        let currentCategory = 'all';
        let searchQuery = '';

        function renderStotras() {
            const grid = document.getElementById('stotraGrid');
            const filtered = stotras.filter(s => {
                const matchCat = currentCategory === 'all' || s.category === currentCategory;
                const matchSearch = s.title.includes(searchQuery) ||
                                    s.en.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    s.god.includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">
                    <i class="fa-solid fa-search"></i>
                    कोई स्तोत्र नहीं मिला। कृपया दूसरा शब्द खोजें।
                </div>`;
                return;
            }

            const badgeClass = (cat) => {
                if (cat === 'chalisa') return 'gold';
                if (cat === 'aarti') return 'green';
                if (cat === 'sahasranama') return 'blue';
                if (cat === 'kavach') return 'blue';
                return '';
            };

            const catName = (cat) => {
                const names = {
                    'chalisa': 'चालीसा',
                    'aarti': 'आरती',
                    'stotra': 'स्तोत्र',
                    'sahasranama': 'सहस्रनाम',
                    'kavach': 'कवच'
                };
                return names[cat] || cat;
            };

            grid.innerHTML = filtered.map(s => `
                <div class="stotra-card">
                    <div class="s-header">
                        <div class="s-title">
                            ${s.title}
                            <span class="s-en">${s.en}</span>
                        </div>
                        <span class="s-badge ${badgeClass(s.category)}">${catName(s.category)}</span>
                    </div>
                    <div class="s-preview">${s.preview}</div>
                    <div class="s-desc">
                        <strong>📖 विवरण:</strong> ${s.desc}
                    </div>
                    <div class="s-benefits">
                        <strong>✨ लाभ:</strong> ${s.benefits}
                    </div>
                    <div class="s-meta">
                        <span><i class="fa-solid fa-clock"></i> ${s.howTo}</span>
                        <span><i class="fa-solid fa-om"></i> ${s.god}</span>
                    </div>
                    <details class="stotra-details">
                        <summary>अधिक जानकारी</summary>
                        <div class="d-body">${s.extra || ''}</div>
                    </details>
                </div>
            `).join('');
        }

        function filterStotras() {
            searchQuery = document.getElementById('stotraSearch').value.trim();
            renderStotras();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderStotras();

            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderStotras();
                });
            });
        });

        // Dark mode
        const darkToggle = document.getElementById('darkToggle');
        if (darkToggle) {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                const isDark = document.body.classList.contains('dark-mode');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('darkMode', isDark);
            });
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '🕉️ सनातन ज्ञान कोश — स्तोत्र कोश',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('लिंक कॉपी हो गया!');
                });
            }
        }
    </script>
